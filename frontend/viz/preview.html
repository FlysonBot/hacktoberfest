<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz preview</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { font-family: var(--font, sans-serif); margin: 0; padding: 24px; background: var(--bg, #FCFAFF); color: var(--text, #1D1D1F); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .bar button, .bar select, .bar input { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 8px; border: 1px solid #C9C6BF; background: #fff; }
  .bar button { cursor: pointer; }
  .bar button:disabled { opacity: 0.4; cursor: default; }
  .bar input { min-width: 240px; }
  #viz { background: var(--stage, #F4EEFF); border-radius: 14px; padding: 20px 16px; min-height: 160px; }
  #meta { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin-top: 12px; color: #555; white-space: pre-wrap; }
  #question { margin-top: 16px; font-size: 16px; }
  #question button { margin: 6px 8px 0 0; font: inherit; padding: 4px 10px; border-radius: 8px; border: 1px solid #C9C6BF; background: #fff; cursor: pointer; }
  .right { color: #1E7B3A; font-weight: 600; } .wrong { color: #8C1D18; font-weight: 600; }
  #error { color: #8C1D18; }
</style>
</head>
<body>
<h1>Viz preview</h1>
<div class="bar">
  <select id="structure"></select>
  <button id="back">◀ Back</button>
  <button id="next">Next ▶</button>
  <span id="counter"></span>
</div>
<div class="bar">
  <input id="sandbox" placeholder="sandbox ops, e.g. insert 70, search 70">
  <button id="run">Run ops</button>
</div>
<div id="viz"></div>
<div id="meta"></div>
<div id="question"></div>
<p id="error"></p>

<script type="module">
import { PLANS } from './_samples.js';

const $ = (id) => document.getElementById(id);
let mod, plan, ops, steps = [], qs = [], index = 0;

for (const name of Object.keys(PLANS)) {
  const o = document.createElement('option');
  o.value = o.textContent = name;
  $('structure').append(o);
}

async function load(structure) {
  try {
    mod = await import(`./${structure}.js`);
    plan = PLANS[structure];
    ops = plan.ops.slice();
    compute(0);
  } catch (e) {
    $('error').textContent = `Failed to load ${structure}: ${e.message}. Open this page over HTTP, not file://.`;
  }
}

function compute(startAt) {
  steps = mod.run(plan.initial, ops);
  qs = mod.questions(steps);
  index = Math.min(startAt, steps.length - 1);
  $('error').textContent = '';
  show();
}

// Same "op args, op args" format as the app's sandbox.
$('run').onclick = () => {
  const extra = $('sandbox').value.split(',').map((p) => p.trim()).filter(Boolean)
    .map((p) => { const [op, ...args] = p.split(/\s+/); return { op: op.toLowerCase(), args }; });
  const first = steps.length;
  ops = ops.concat(extra);
  compute(first);
};

function show() {
  const step = steps[index];
  mod.render($('viz'), step);
  $('counter').textContent = `Step ${index + 1} / ${steps.length}`;
  $('back').disabled = index === 0;
  $('next').disabled = index === steps.length - 1;
  $('meta').textContent = `action: ${step.action}\ndetail: ${JSON.stringify(step.detail)}\nhighlights: ${JSON.stringify(step.highlights)}`;

  const q = qs.find((x) => x.stepIndex === index);
  const box = $('question');
  box.replaceChildren();
  if (!q) return;
  const p = document.createElement('div');
  p.textContent = `Practice: ${q.prompt}`;
  const result = document.createElement('div');
  box.append(p);
  for (const choice of q.choices) {
    const b = document.createElement('button');
    b.textContent = choice;
    b.onclick = () => {
      const ok = choice === q.answer;
      result.className = ok ? 'right' : 'wrong';
      result.textContent = ok ? 'Correct!' : `Not quite. The answer is ${q.answer}.`;
    };
    box.append(b);
  }
  box.append(result);
}

$('back').onclick = () => { if (index > 0) { index--; show(); } };
$('next').onclick = () => { if (index < steps.length - 1) { index++; show(); } };
$('structure').onchange = (e) => load(e.target.value);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') $('back').click();
  if (e.key === 'ArrowRight') $('next').click();
});
load($('structure').value);
</script>
</body>
</html>
